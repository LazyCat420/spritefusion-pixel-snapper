[package]
name = "spritefusion-pixel-snapper"
version = "1.0.0"
edition = "2021"
description = "Fix AI-generated pixel art by detecting and snapping it to its implicit grid."
license = "MIT"
repository = "https://github.com/Hugo-Dz/spritefusion-pixel-snapper"
homepage = "https://www.spritefusion.com/pixel-snapper"
readme = "README.md"
keywords = ["pixel-art", "image-processing", "cli", "wasm", "gamedev"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spritefusion-pixel-snapper"
path = "src/main.rs"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
rand_chacha = "0.3"

# Native CLI dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

# Tooling standard 2026-11-17: mirrors the drift-king engine `[workspace.lints]`
# table (games/drift-king/engine/Cargo.toml) at warn level. Baseline warning
# counts: clippy-baseline.txt; promote warn -> deny only at zero.
[lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Hand-picked pedantic subset: catches real bugs, not style.
cast_lossless = "warn"
cast_possible_truncation = "warn"
float_cmp = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
