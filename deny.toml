[advisories]
yanked = "deny"
# Nothing to ignore: this dependency tree triggers no advisories. The rand
# unsoundness (RUSTSEC-2026-0097) was fixed by the semver-compatible bump
# rand 0.8.5 -> 0.8.8 (patched range >=0.8.6, <0.9.0), not ignored.
# Vulnerabilities are NOT ignored: fix them with `cargo update -p <crate>`.
ignore = []

[licenses]
allow = [
  "MIT", "MIT-0", "CDLA-Permissive-2.0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense",
  "OFL-1.1", "BSL-1.0", "NCSA", "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
