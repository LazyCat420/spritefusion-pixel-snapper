[advisories]
yanked = "deny"
# Unmaintained, no replacement on our stack today:
#   RUSTSEC-2024-0436 paste          — macro-only, via the wgpu/glam stack
#   RUSTSEC-2026-0192 rustybuzz      — text shaping via the font stack
#   RUSTSEC-2026-0206 ttf-parser     — ditto
#   RUSTSEC-2023-0089 atomic-polyfill — via embedded-* HAL crates
#   RUSTSEC-2026-0097 rand 0.8       — unsound ONLY when a custom log logger
#       calls rand::rng(); this crate defines no logger and draws only from
#       ChaCha8Rng/small_rng. rand 0.8->0.9 is a breaking production change
#       outside this tooling slice; tracked in the SmallRust report.
# Vulnerabilities are NOT ignored: fix them with `cargo update -p <crate>`.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192", "RUSTSEC-2026-0206", "RUSTSEC-2023-0089", "RUSTSEC-2026-0097"]

[licenses]
allow = [
  "MIT", "MIT-0", "CDLA-Permissive-2.0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense",
  "OFL-1.1", "BSL-1.0", "NCSA", "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
